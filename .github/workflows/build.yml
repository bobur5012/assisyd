name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Cache voice models
        uses: actions/cache@v4
        with:
          path: |
            ~/vosk
            ~/tts
          key: models-vosk-0.22-sherpa-1.13.7-irina

      - name: Download offline voice models (Russian + Uzbek)
        run: |
          set -e
          mkdir -p ~/vosk app/src/main/assets
          fetch() {
            lang=$1; name=$2
            if [ ! -d ~/vosk/$name ]; then
              curl -fsSL --retry 3 -o /tmp/$name.zip "https://alphacephei.com/vosk/models/$name.zip"
              unzip -q /tmp/$name.zip -d ~/vosk
            fi
            rm -rf app/src/main/assets/model-$lang
            cp -r ~/vosk/$name app/src/main/assets/model-$lang
            echo "$name" > app/src/main/assets/model-$lang/uuid
            du -sh app/src/main/assets/model-$lang
          }
          fetch ru vosk-model-small-ru-0.22
          fetch uz vosk-model-small-uz-0.22 || echo "::warning::Uzbek model not available"

      - name: Download offline speech synthesis (sherpa-onnx + Russian Piper voice)
        run: |
          set -e
          mkdir -p ~/tts app/libs app/src/main/assets/tts
          if [ ! -f ~/tts/sherpa-onnx.aar ]; then
            curl -fsSL --retry 3 -o ~/tts/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
          fi
          cp ~/tts/sherpa-onnx.aar app/libs/sherpa-onnx.aar
          if [ ! -d ~/tts/vits-piper-ru_RU-irina-medium ]; then
            curl -fsSL --retry 3 -o /tmp/voice.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-ru_RU-irina-medium.tar.bz2
            tar xjf /tmp/voice.tar.bz2 -C ~/tts
          fi
          V=~/tts/vits-piper-ru_RU-irina-medium
          cp $V/*.onnx app/src/main/assets/tts/model.onnx
          cp $V/tokens.txt app/src/main/assets/tts/tokens.txt
          rm -rf app/src/main/assets/tts/espeak-ng-data
          cp -r $V/espeak-ng-data app/src/main/assets/tts/espeak-ng-data
          ls -la app/src/main/assets/tts; du -sh app/src/main/assets/tts

      - name: Build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk yoldosh.apk
          ls -la yoldosh.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yoldosh-${{ github.run_number }}
          path: yoldosh.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Yo'ldosh 0.1.${{ github.run_number }}"
          body: |
            Сборка ${{ github.run_number }} из коммита ${{ github.sha }}.
            Скачать: yoldosh.apk ниже. Постоянная ссылка на последнюю версию:
            https://github.com/${{ github.repository }}/releases/latest/download/yoldosh.apk
          files: yoldosh.apk
          make_latest: true
